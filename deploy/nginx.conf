# TEMPLATE. Copy of /etc/nginx/sites-enabled/dns-audit on the droplet, taken
# 2026-09-30 after the /static/ cache change. DEPLOY_USER is a placeholder for
# the account that owns the checkout; the real value is in deploy.local.md.
# The droplet file is the live one; editing this copy changes nothing there.

# A request with ?v= names a versioned asset (style.css, app.js, theme.js,
# articles.js) and can be cached for good. Anything without one (fonts,
# favicons, icons) must be revalidated, or a change takes a week to arrive.
map $arg_v $static_cache_control {
    ""      "public, max-age=3600, must-revalidate";
    default "public, max-age=604800, immutable";
}

server {
    listen 443 ssl;
    server_name dns-audit.com www.dns-audit.com;

    ssl_certificate /etc/ssl/cloudflare-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare-key.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Serve static files directly from disk (bypass uvicorn)
    location /static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        alias /home/DEPLOY_USER/dns-security-auditor/static/;
        add_header Cache-Control $static_cache_control always;
        access_log off;
        tcp_nopush on;
        sendfile on;
    }

    # SSE needs long timeouts
    location /api/audit/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # All other requests to uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name dns-audit.com www.dns-audit.com;
    return 301 https://$host$request_uri;
}
