# eth1 is the DigitalOcean private network. Its DNS servers are reachable
# only through eth0, so queries systemd-resolved sends on this link fail
# with "No route to host". A negative answer (NXDOMAIN) on eth0 then loses
# to that error and every lookup of a name that does not exist times out,
# which made dns-audit report MTA-STS, TLS-RPT and BIMI as "not checked".
# Keep the servers for completeness but never route ordinary lookups here.
[Network]
DNSDefaultRoute=no
