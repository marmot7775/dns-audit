name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload authenticates with GitHub OIDC, so no token secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test_asset_version_is_current compares the ?v= commit
          # with the last commit that touched the versioned assets.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests/ -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          # A Codecov outage should not block a merge.
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install scanners
        run: pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - name: bandit
        run: bandit -r . -x ./tests -ll
