[project]
name = "dns-audit"
version = "2.0.0"
description = "DNS and email security audit: DMARC, SPF, DKIM, MTA-STS, DNSSEC, DANE, CAA, BIMI, TLS-RPT, MX, nameservers, Certificate Transparency."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The rule set is named, not left to ruff's default. ruff 0.16 widened its
# default set: on this repo it reports 696 findings where 0.15 reported 32,
# so an unpinned default would turn CI red on a ruff upgrade alone. E4, E7,
# E9 and F are the classic defaults and the ones that carry signal here
# (unused names, undefined names, syntax). Widening to E,F,W,I reports about
# 1800, 1620 of them E501, and stays off until that debt is paid down
# deliberately. CI runs `ruff check .` as a gate (.github/workflows/lint.yml).
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Late imports are deliberate. 24 of the 28 hits are in
    # audit_engine.py, where the logging setup precedes
    # `import dns.resolver`.
    "E402",
]

[tool.mypy]
# Report only for now: CI prints the error count and does not fail on it.
# The count to drive to zero is in CHANGELOG.md.
files = ["*.py", "tools/*.py"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
