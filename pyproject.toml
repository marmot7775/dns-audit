[project]
name = "dns-security-auditor"
version = "2.0.0"
description = "DNS and email security audit: DMARC, SPF, DKIM, MTA-STS, DNSSEC, DANE, CAA, BIMI, TLS-RPT, MX, nameservers, Certificate Transparency."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# No select, so `ruff check .` runs ruff's default rule set. On ruff 0.16.1
# that set is wider than the E4, E7, E9, F this comment used to name: it
# reports 696 findings here, 29 of them in E4, E7, E9 and F. Widening to
# E,F,W,I reports 1810 instead, and 1620 of those are E501 alone. That
# volume buries the findings that carry signal, so E,F,W,I stays off until
# the formatting debt is paid down deliberately.
ignore = [
    # Late imports are deliberate. 24 of the 28 hits are in
    # audit_engine.py, where the logging setup precedes
    # `import dns.resolver`.
    "E402",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
